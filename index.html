function checkBadges(currentSession) {
  if (!Array.isArray(state.badges)) state.badges = [];
  const newlyUnlocked = [];

  const grantBadge = id => {
    if (!state.badges.includes(id)) {
      state.badges.push(id);
      const b = BADGES.find(item => item.id === id);
      if (b) newlyUnlocked.push(b);
    }
  };

  if (state.completed.length >= 1) grantBadge('first_lesson');
  if (streak() >= 3) grantBadge('streak_3');
  if (currentSession && currentSession.firstCorrect === currentSession.questions.length && currentSession.questions.length >= 6) {
    grantBadge('perfect_round');
  }

  const foodLessons = COURSE.lessons.filter(l => l.category === 'food').map(l => l.id);
  if (foodLessons.length && foodLessons.every(id => state.completed.includes(id))) grantBadge('food_master');

  const travelLessons = COURSE.lessons.filter(l => l.category === 'travel').map(l => l.id);
  if (travelLessons.length && travelLessons.every(id => state.completed.includes(id))) grantBadge('travel_master');

  if (state.completed.length >= COURSE.lessons.length) grantBadge('trail_champ');

  return newlyUnlocked;
}

function validState(s) {
  return s && s.version === 1 &&
    Number.isFinite(s.xp) && s.xp >= 0 &&
    Array.isArray(s.completed) && s.completed.every(x => COURSE.lessons.some(l => l.id === x)) &&
    Array.isArray(s.dates) && s.dates.every(x => typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x)) &&
    s.words && typeof s.words === 'object' && !Array.isArray(s.words) &&
    Object.entries(s.words).every(([id, v]) => ALL.some(w => w.id === id) && v && Number.isInteger(v.level) && v.level >= 0 && v.level <= 4 && Number.isFinite(v.due));
}

// Format friendly Firebase Auth error messages
function formatAuthError(code, message) {
  switch (code) {
    case 'auth/configuration-not-found':
      return 'Firebase Authentication is not activated in this project yet. Please open Firebase Console > Build > Authentication, click "Get started", and enable the Email/Password sign-in method.';
    case 'auth/operation-not-allowed':
      return 'Email/Password sign-in is currently disabled. Please enable "Email/Password" in Firebase Console > Authentication > Sign-in method.';
    case 'auth/unauthorized-domain':
      return 'This domain is not authorized. Please add it in Firebase Console > Authentication > Settings > Authorized domains.';
    case 'auth/invalid-email':
      return 'Please enter a valid email address.';
    case 'auth/user-not-found':
    case 'auth/wrong-password':
    case 'auth/invalid-credential':
      return 'Incorrect email or password. Please try again.';
    case 'auth/email-already-in-use':
      return 'An account already exists with this email address. Please sign in instead.';
    case 'auth/weak-password':
      return 'Password should be at least 6 characters.';
    case 'auth/too-many-requests':
      return 'Access temporarily blocked due to too many attempts. Please try again later or reset password.';
    case 'auth/network-request-failed':
      return 'Network connection error. Please check your internet connection.';
    case 'auth/requires-recent-login':
      return 'Please sign in again before attempting this action.';
    default:
      return message || 'An unexpected error occurred. Please try again.';
  }
}

// Progress persistence (local cache + Firebase Firestore cloud sync)
function persist() {
  const snapshot = JSON.stringify(state);
  if (storage === 'session') return;
  saveQueue = saveQueue.then(async () => {
    try {
      if (storage === 'tasklet') {
        await window.tasklet.sqlExec(`INSERT OR REPLACE INTO hola_trail_progress (id,data) VALUES ('spanish-v1','${snapshot.replaceAll("'","''")}')`);
      } else {
        localStorage.setItem('hola-trail-es-v1', snapshot);
      }

      if (currentUser && db) {
        try {
          await setDoc(doc(db, 'users', currentUser.uid), {
            email: currentUser.email,
            updatedAt: new Date().toISOString(),
            progress: state
          }, { merge: true });
        } catch (cErr) {
          console.warn('Cloud sync error, progress cached locally', cErr);
        }
      }
    } catch (e) {
      console.error('Progress save failed', e);
    }
  });
}

// Cloud progress sync on login
async function syncCloudProgress(user) {
  if (!user || !db) return;
  try {
    const userRef = doc(db, 'users', user.uid);
    const snap = await getDoc(userRef);
    if (snap.exists()) {
      const data = snap.data();
      const cloudState = data?.progress;
      if (validState(cloudState)) {
        const merged = {
          version: 1,
          xp: Math.max(state.xp || 0, cloudState.xp || 0),
          completed: Array.from(new Set([...(state.completed || []), ...(cloudState.completed || [])])),
          dates: Array.from(new Set([...(state.dates || []), ...(cloudState.dates || [])])).sort(),
          words: { ...(cloudState.words || {}) },
          badges: Array.from(new Set([...(state.badges || []), ...(cloudState.badges || [])]))
        };
        if (state.words) {
          for (const [wid, localW] of Object.entries(state.words)) {
            const cloudW = merged.words[wid];
            if (!cloudW) {
              merged.words[wid] = localW;
            } else {
              merged.words[wid] = {
                level: Math.max(localW.level, cloudW.level),
                due: Math.max(localW.due, cloudW.due)
              };
            }
          }
        }
        state = merged;
        localStorage.setItem('hola-trail-es-v1', JSON.stringify(state));
        await setDoc(userRef, {
          email: user.email,
          updatedAt: new Date().toISOString(),
          progress: state
        }, { merge: true });
      }
    } else {
      await setDoc(userRef, {
        email: user.email,
        updatedAt: new Date().toISOString(),
        progress: state
      });
    }
    render();
  } catch (err) {
    console.error('Cloud progress sync error:', err);
  }
}

// Streak and review calculations
function streak() {
  let count = 0, d = new Date();
  if (!state.dates.includes(dateKey(d))) d.setDate(d.getDate() - 1);
  while (state.dates.includes(dateKey(d))) {
    count++;
    d.setDate(d.getDate() - 1);
  }
  return count;
}

function dueWords() {
  return ALL.filter(w => state.words[w.id] && state.words[w.id].due <= Date.now());
}

function shuffled(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

function normalize(s) {
  return s.normalize('NFC').toLocaleLowerCase('es').replace(/[¿?¡!.,;:]/g, '').replace(/\s+/g, ' ').trim();
}

function go(hash) {
  if (location.hash === hash) render();
  else location.hash = hash;
}

function navigate(hash) {
  session = null;
  resetArmed = false;
  go(hash);
}

// Prepare questions: strictly Write (type), Read (build, choice), Listen (listen) — NO speaking
function prepareQuestion(w, index) {
  const mode = ['choice', 'type', 'build', 'listen'][index % 4];
  const actual = mode === 'build' && w.es.split(' ').length < 2 ? 'choice' : mode;

  // Prioritize smart distractors from the same category
  const sameCat = ALL.filter(x => x.category === w.category && x.en !== w.en);
  const otherCat = ALL.filter(x => x.category !== w.category && x.en !== w.en);
  const pool = [...shuffled(sameCat), ...shuffled(otherCat)];
  const distractors = pool.slice(0, 3);

  return {
    w,
    mode: actual,
    options: shuffled([w, ...distractors]),
    tiles: shuffled(w.es.split(' ').map((text, i) => ({ text, id: i }))),
    selected: [],
    attempts: 0,
    done: false,
    value: '',
    feedback: null,
    revealed: false
  };
}

function beginQuiz(reviewItems) {
  if (reviewItems) session = { review: true, lesson: null, items: reviewItems };
  const current = session;
  current.phase = 'quiz';
  current.index = 0;
  current.firstCorrect = 0;
  current.wrongIds = [];
  current.questions = shuffled(current.items).map(prepareQuestion);
  current.awarded = false;
  go('#study');
}

function startReview(categoryId = null) {
  let pool = ALL.filter(w => state.words[w.id]);
  if (categoryId) {
    pool = pool.filter(w => w.category === categoryId);
  }
  if (!pool.length) return;
  const due = pool.filter(w => state.words[w.id].due <= Date.now());
  beginQuiz(shuffled(due.length ? due : pool).slice(0, 8));
}

          '<span><kbd class="shortcut-key">Enter</kbd> Check answer</span>' + (q.mode === 'type' ? ' <span><kbd class="shortcut-key">R</kbd> Hear audio</span>' : '')
        }
      </div>
    </div>
  `;

  // Auto-play audio on listening question if first time opening
  if (q.mode === 'listen' && !q.value && q.attempts === 0 && !q.revealed) {
    setTimeout(() => speak(), 120);
  }
}

function hasAnswer(q) {
  return q.mode === 'build' ? q.selected.length === q.tiles.length : !!q.value.trim();
}

function checkAnswer() {
  const s = session, q = s.questions[s.index];
  if (q.done || !hasAnswer(q)) return;
  let correct;
  if (q.mode === 'build') correct = normalize(q.selected.map(id => q.tiles.find(t => t.id === id).text).join(' ')) === normalize(q.w.es);
  else if (q.mode === 'type') correct = normalize(q.value) === normalize(q.w.es);
  else correct = q.value === q.w.id;

  q.attempts++;
  q.feedback = { correct };
  if (correct) {
    q.done = true;
    if (q.attempts === 1) s.firstCorrect++;
  } else if (!s.wrongIds.includes(q.w.id)) {
    s.wrongIds.push(q.w.id);
  }
  quiz();
  if (q.mode === 'type' && !correct) $('#answer')?.focus();
}

function complete() {
  const s = session;
  if (s.awarded) return;
  s.awarded = true;
  s.phase = 'result';
  const newLesson = !s.review && !state.completed.includes(s.lesson.id);
  s.earned = s.review ? 10 + (s.firstCorrect * 2) : newLesson ? 30 + s.firstCorrect * 5 : 10;
  state.xp += s.earned;
  if (newLesson) state.completed.push(s.lesson.id);
  const today = dateKey();
  if (!state.dates.includes(today)) state.dates.push(today);
  const intervals = [1, 3, 7, 14, 30];
  s.questions.forEach(q => {
    const old = state.words[q.w.id],
          missed = s.wrongIds.includes(q.w.id),
          level = missed ? 0 : Math.min((old?.level ?? -1) + 1, 4);
    state.words[q.w.id] = {
      level,
      due: Date.now() + (missed ? 10 * 60 * 1000 : intervals[level] * 86400000)
    };
  });
  s.newlyUnlockedBadges = checkBadges(s);
  persist();
  render();
}

  app.innerHTML = `

        <p class="muted">You practiced ${s.questions.length} expressions with writing, reading, and listening drills.</p>
        <div class="result-stats">
          <div>
            <strong>+${s.earned}</strong>
            <span class="small muted">XP earned</span>
          </div>

            <strong>${s.firstCorrect}/${s.questions.length}</strong>
            <span class="small muted">First-try answers</span>
          </div>

        ${badgesHtml}
        <div class="tip">
          ${s.wrongIds.length ? `${s.wrongIds.length} expression${s.wrongIds.length === 1 ? ' needs' : 's need'} another look. They will be ready for review in 10 minutes.` : 'Your next scheduled review is in at least one day. You can also practice whenever you like.'}
        </div>

        <div class="row center" style="gap:12px;margin-top:16px;flex-wrap:wrap">

// Audio speech synthesis helper (learn & listening rehearsal)
function speak(customText = null) {
  const text = customText || (session?.phase === 'learn' ? session.items[session.index].es : session?.questions?.[session.index]?.w.es);
  const status = $('#speech-status');
  if (!text) return;
  if (!('speechSynthesis' in window)) {
    if (status) status.textContent = 'Speech is not supported here. Use the written expression instead.';
    return;
  }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = COURSE.locale;
    u.rate = speechSpeed;
    const voices = speechSynthesis.getVoices();
    const voice = voices.find(v => v.lang === COURSE.locale) || voices.find(v => v.lang.startsWith('es'));
    if (voice) u.voice = voice;
    u.onstart = () => { if (status) status.textContent = `◖)) Playing pronunciation (${speechSpeed === 0.82 ? '0.8x' : '1.0x'})…`; };
    u.onend = () => { if (status) status.textContent = 'Listen again as often as you like.'; };
    u.onerror = () => { if (status) status.textContent = 'Audio could not play. Use the written expression or try another browser.'; };
    speechSynthesis.speak(u);
    if (status) status.textContent = 'Requesting audio…';
  } catch (e) {
    console.error('Speech unavailable', e);
    if (status) status.textContent = 'Audio is unavailable here. Use the written expression instead.';
  }
}

// Authentication Actions
async function handleAuthSubmit() {
  const emailInput = $('#auth-email');
  const passInput = $('#auth-password');
  const confirmPassInput = $('#auth-confirm-password');
  const submitBtn = $('#auth-submit-btn');

  const email = emailInput ? emailInput.value.trim() : '';
  const password = passInput ? passInput.value : '';
  const confirmPassword = confirmPassInput ? confirmPassInput.value : '';

  if (!email) {
    authNotice = { type: 'error', text: 'Please enter your email address.' };
    renderAuthModal();
    return;
  }

  if (submitBtn) submitBtn.disabled = true;

  try {
    if (authModalMode === 'signup') {
      if (!password || password.length < 6) {
        authNotice = { type: 'error', text: 'Password must be at least 6 characters long.' };
        renderAuthModal();
        return;
      }
      if (password !== confirmPassword) {
        authNotice = { type: 'error', text: 'Passwords do not match. Please re-type.' };
        renderAuthModal();
        return;
      }

      const cred = await createUserWithEmailAndPassword(auth, email, password);
      try {
        await sendEmailVerification(cred.user);
        authNotice = {
          type: 'success',
          text: `Account created! We sent a verification email to ${email}. Please check your inbox.`
        };
      } catch (vErr) {
        console.warn('Verification email failed to send', vErr);
        authNotice = {
          type: 'success',
          text: 'Account created! You are signed in.'
        };
      }
      setTimeout(() => {
        closeAuthModal();
      }, 2000);
    } else if (authModalMode === 'signin') {
      if (!password) {
        authNotice = { type: 'error', text: 'Please enter your password.' };
        renderAuthModal();
        return;
      }
      await signInWithEmailAndPassword(auth, email, password);
      closeAuthModal();
    } else if (authModalMode === 'forgot') {
      await sendPasswordResetEmail(auth, email);
      authNotice = {
        type: 'success',
        text: `A password reset link has been sent to ${email}. Check your inbox.`
      };
      renderAuthModal();
    }
  } catch (err) {
    console.error('Auth error:', err);
    authNotice = { type: 'error', text: formatAuthError(err.code, err.message) };
    renderAuthModal();
  } finally {
    const btn = $('#auth-submit-btn');
    if (btn) btn.disabled = false;
  }
}

}

async function handleCheckVerification() {
  if (!currentUser) return;

    if (currentUser.emailVerified) {

      setTimeout(() => updateVerificationBanner(), 2500);

    }

}

// Global click event dispatcher
document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b || b.disabled || !ready || busy) return;
  const action = b.dataset.action;
  const id = b.dataset.id;
  const mode = b.dataset.mode;

  switch (action) {
    case 'home': navigate('#home'); break;
    case 'dashboard': navigate('#learn'); break;
    case 'explore': navigate('#courses'); break;
    case 'start': startLesson(COURSE.lessons.find(l => !state.completed.includes(l.id))?.id || COURSE.lessons[0].id); break;
    case 'lesson': startLesson(id); break;
    case 'exit': navigate('#learn'); break;
    case 'next':
      if (session.index < session.items.length - 1) {
        session.index++;
        learn();
      } else {
        beginQuiz();
      }
      break;
    case 'previous':
      if (session.index > 0) {
        session.index--;
        learn();
      }
      break;
    case 'review': startReview(); break;
    case 'review-category': startReview(id); break;
    case 'speak': speak(); break;
    case 'speak-word': {
      const text = b.dataset.text;
      if (text) speak(text);
      break;
    }
    case 'toggle-preview':
      previewOpenLessonId = (previewOpenLessonId === id ? null : id);
      render();
      break;
    case 'toggle-speed':
      speechSpeed = speechSpeed === 0.82 ? 1.0 : 0.82;
      speak();
      if (session?.phase === 'learn') learn();
      else if (session?.phase === 'quiz') quiz();
      break;
    case 'filter-category':
      activeCategory = id || 'all';
      render();
      break;
    case 'choose': {
      const q = session.questions[session.index];
      if (q.done) break;
      q.value = id;
      q.feedback = null;
      quiz();
      break;
    }
    case 'tile':
    case 'untile': {
      const q = session.questions[session.index];
      if (q.done) break;
      const n = Number(id);
      if (action === 'tile' && !q.selected.includes(n)) q.selected.push(n);
      if (action === 'untile') q.selected = q.selected.filter(x => x !== n);
      q.feedback = null;
      quiz();
      break;
    }
    case 'accent': {
      const input = $('#answer'), q = session.questions[session.index];
      if (!input || q.done) break;
      const start = input.selectionStart ?? input.value.length, end = input.selectionEnd ?? start;
      input.setRangeText(id, start, end, 'end');
      q.value = input.value;
      q.feedback = null;
      updateCheck();
      input.focus();
      break;
    }
    case 'reveal':
      session.questions[session.index].revealed = true;
      quiz();
      break;
    case 'check': checkAnswer(); break;
    case 'continue': {
      const q = session.questions[session.index];
      if (!q.done) break;
      if (session.index < session.questions.length - 1) {
        session.index++;
        quiz();
      } else {
        complete();
      }
      break;
    }
    case 'reset':
      if (!resetArmed) {
        resetArmed = true;
        privacy();
      } else {
        state = fresh();
        persist();
        navigate('#learn');
      }
      break;
    case 'open-auth':
      openAuthModal(mode || 'signin');
      break;
    case 'close-auth':
      closeAuthModal();
      break;
    case 'switch-auth-mode':
      authModalMode = mode || 'signin';
      authNotice = null;
      renderAuthModal();
      break;
    case 'sign-out':
      handleSignOut();
      break;
    case 'resend-verification':
      handleResendVerification();
      break;
    case 'check-verified':
      handleCheckVerification();
      break;
  }
});

// Form submit event for auth

function updateCheck() {
  const q = session?.questions?.[session.index], b = $('[data-action="check"]');
  if (b && q) b.disabled = !hasAnswer(q);
}

document.addEventListener('input', e => {
  if (e.target.id === 'answer') {
    const q = session.questions[session.index];
    q.value = e.target.value;
    q.feedback = null;
    const feedback = $('.feedback');
    if (feedback) feedback.remove();
    updateCheck();
  }
});

document.addEventListener('keydown', e => {
  // Modal escape
  if (e.key === 'Escape' && $('#auth-modal')?.style.display === 'flex') {
    closeAuthModal();
    return;
  }

  // Answer input Enter key
  if (e.target && e.target.id === 'answer') {
    if (e.key === 'Enter') {
      e.preventDefault();
      const q = session?.questions?.[session?.index];
      if (q && q.done) {
        $('[data-action="continue"]')?.click();
      } else {
        checkAnswer();
      }
    }
    return; // Don't process single-key shortcuts while typing in input
  }

  // If typing in any input/textarea, do not capture single keys
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
    return;
  }

  // Session phase: learn
  if (session && session.phase === 'learn') {
    if (e.key === 'ArrowRight' || e.key === 'Enter') {
      e.preventDefault();
      $('[data-action="next"]')?.click();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      $('[data-action="previous"]')?.click();
    } else if (e.key === 'r' || e.key === 'R') {
      e.preventDefault();
      speak();
    }
    return;
  }

  // Session phase: quiz
  if (session && session.phase === 'quiz') {
    const q = session.questions[session.index];
    if (e.key === 'r' || e.key === 'R') {
      e.preventDefault();
      speak();
      return;
    }
    if (q.done) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        $('[data-action="continue"]')?.click();
      }
      return;
    }
    if (q.mode === 'choice' || q.mode === 'listen') {
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= q.options.length) {
        e.preventDefault();
        q.value = q.options[num - 1].id;
        q.feedback = null;
        quiz();
        return;
      }
    }
    if (e.key === 'Enter') {
      if (hasAnswer(q)) {
        e.preventDefault();
        checkAnswer();
      }
    }
  }
});

// Initialize application and Firebase
async function initialize() {
  // Step 1: Load local storage or workspace storage
  try {
    if (window.tasklet?.sqlExec && window.tasklet?.sqlQuery) {
      storage = 'tasklet';
      await window.tasklet.sqlExec('CREATE TABLE IF NOT EXISTS hola_trail_progress (id TEXT PRIMARY KEY, data TEXT NOT NULL)');
      const rows = await window.tasklet.sqlQuery("SELECT data FROM hola_trail_progress WHERE id = 'spanish-v1'");
      if (rows.length) {
        const s = JSON.parse(rows[0].data);
        if (!validState(s)) throw Error('Saved progress has an unsupported format.');
        if (!Array.isArray(s.badges)) s.badges = [];
        state = s;
      }
    } else {
      storage = 'browser';
      const saved = localStorage.getItem('hola-trail-es-v1');
      if (saved) {
        const s = JSON.parse(saved);
        if (!validState(s)) throw Error('Saved progress has an unsupported format.');
        if (!Array.isArray(s.badges)) s.badges = [];
        state = s;
      }
      localStorage.setItem('hola-trail-storage-test', '1');
      localStorage.removeItem('hola-trail-storage-test');
    }
  } catch (e) {
    console.error('Progress could not be loaded', e);
    storage = 'session';
  }

  ready = true;
  render();

  // Step 2: Initialize Firebase Authentication & Cloud Database
  try {
    const dynamicConfig = await getFirebaseConfig();
    const configToUse = dynamicConfig?.apiKey ? dynamicConfig : firebaseConfig;
    firebaseApp = initializeApp(configToUse);

    if (typeof window !== 'undefined') {
      try {
        const supported = await isAnalyticsSupported();
        if (supported) analytics = getAnalytics(firebaseApp);
      } catch (_) {}
    }

    auth = getAuth(firebaseApp);
    db = getFirestore(firebaseApp);

    // Listen to Firebase Authentication state changes
    onAuthStateChanged(auth, async user => {
      currentUser = user;
      updateNavAuth();
      updateVerificationBanner();
      if (user) {
        await syncCloudProgress(user);
      }
      render();
    });
  } catch (fbErr) {
    console.error('Firebase initialization error:', fbErr);
  }
}

initialize();
